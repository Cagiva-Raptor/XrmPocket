# Projectbeslissingen — XrmPocket (xrmpocket)
#
# Elke beslissing heeft: id, datum, titel, decision (de afspraak zelf, inclusief
# "Handhaving:"-regel), rationale (waarom) en status. Voeg een nieuwe beslissing toe in
# plaats van een bestaande stilletjes te overschrijven; wie een vorige beslissing
# vervangt, laat het oude id staan met status "superseded" en geeft de vervanger een
# nieuw id.
#
# Nooit secrets (wachtwoorden, tokens, sleutels) in dit bestand. De SSH-deploy key
# blijft in ~/.ssh/ en komt hier niet in voor.

version: 1
notes:
  - id: 2026-10-30-project-aangemaakt-met-conventies
    date: 2026-10-30
    title: "Project start als map met conventies; nog géén taal of framework kiezen"
    decision: "Het project start als map met conventies: CONTEXT.md, git met een
      .gitignore, een eigen afspraken/decisions.yaml en registratie in de Sauron-brug.
      Er wordt nog géén taal/framework gekozen. Handhaving: geen package.json,
      project.yml, pyproject.toml, Package.swift of vergelijkbare stack-bestanden
      toevoegen zonder een nieuwe beslissing die deze vervangt. Merk op dat de
      bestaande repo Cagiva-Raptor/XrmPocket voorlopig leeg blijft tot er een stack
      ligt; de remote-URL gebruikt de host-alias github.com-xrmpocket zodat enkel de
      deploy key (niet de persoonlijke sleutel) wordt aangeboden."
    rationale: "Eerst het doel en de scope, dan de stack. Het doel (XrmToolBox
      beschikbaar maken op iOS) staat in CONTEXT.md zoals de gebruiker het meegaf; de
      scope en platformkeuze zijn nog niet bepaald, dus nu al een stack kiezen zou die
      keuze stiekem vastleggen."
    files:
      - CONTEXT.md
      - afspraken/decisions.yaml
    status: superseded
    superseded_by: 2026-10-30-stack-aspnetcore-react
  - id: 2026-10-30-zichtbaar-in-sauron-app
    date: 2026-10-30
    title: "Het project is opgenomen in bridge/projects.json met id 'xrmpocket' en poort 4107"
    decision: "Het project is geregistreerd in bridge/projects.json met id 'xrmpocket',
      name 'XrmPocket', path /Users/jurgendictus/opencode/xrmpocket en port 4107. De
      sessietitel is 'Sauron - XrmPocket'. Handhaving: volgende vrije poort (4101-4106
      zijn bezet; nooit een bestaande poort hergebruiken of wijzigen), de brug
      herstarten na elke wijziging aan projects.json, nooit twee sessies met dezelfde
      titel, en beide kopieën gelijk houden (live ~/Projects/Sauron/bridge en
      git-repo ~/opencode/Sauron/bridge)."
    rationale: "Een bestaande map is zonder een regel in projects.json niet zichtbaar
      in de Sauron-app; dat leerden we bij het Savaco-project. De vorige vrije poort
      (4106) is sindsdien door Savaco ingenomen, dus 4107 is de volgende."
    files:
      - CONTEXT.md
    status: active
  - id: 2026-10-30-naam-en-merkkader
    date: 2026-10-30
    title: "Merknaam XrmPocket; 'XrmToolBox' niet als app-naam gebruiken"
    decision: "De app heet XrmPocket (gebruikerskeuze 2026-10-30; vrij zowel in de
      App Store als op GitHub). De naam 'XrmToolBox' en de code van MscrmTools worden
      NIET als app-naam of officiële branding gebruikt, tenzij er ooit een expliciete
      samenwerking met Tanguy Touré/MscrmTools komt. Handhaving: in README, App
      Store-listing en UI alleen 'geinspireerd door XrmToolBox' of gelijkaardige
      naamsvermelding; geen 'XrmToolBox for iOS'. Bij hergebruik van GPL-3.0-code
      (XrmToolBox zelf) wordt het eigen project GPL-3.0; MIT-code (o.a. MarkMpn/Sql4CDS)
      mag vrij hergebruikt worden met naamsvermelding."
    rationale: "XrmToolBox is het merk van een ander en de iOS-app wordt een nieuw
      werk (WinForms draait niet op iOS), geen port. Een naam die de indruk wekt van
      een officieel product zou zowel merk als gebruikers misleiden. De licence-regel
      voorkomt dat er ongemerkt copyleft-verplichtingen het project in sluipt."
    files:
      - CONTEXT.md
    status: active
  - id: 2026-10-30-web-based-eerst-geen-native-start
    date: 2026-10-30
    title: "Richting: web-based (backend + web-UI/PWA); native Xcode komt later pas als wrapper"
    decision: "De eerste versie is VOLLEDIG WEB-BASED: een backend die de Sql4Cds-
      engine inprocess of als subprocess gebruikt, en een web-frontend (PWA-klaar) die
      die backend aanspreekt. Er wordt GEEN native Xcode/SwiftUI-app gestart. Het
      app-only client secret blijft uitsluitend server-side in
      ~/.config/opencode/secrets/ (chmod 600), nooit in een app-binary en nooit in de
      repo. Handhaving: geen Package.swift/Xcode-project vóór een latere beslissing die
      deze vervangt; de backend spreekt uitsluitend dev/test/acc (standaard SAV-TEST)
      en Productie enkel via de volledige URL; een eventuele native app is later een
      wrapper rond DEZELFDE backend (tweede client), nooit een herschrijving van engine
      of API. De concrete stack (backend-taal, frontend) wordt in fase 0 als aparte
      beslissing genoteerd en vervangt dan
      2026-10-30-project-aangemaakt-met-conventies — pas dán stack-bestanden maken."
    rationale: "CA blokkeert interactieve login op onbeheerde apparaten (AADSTS530033,
      bewezen op LXC én Mac Mini); een web-backend gebruikt app-only en omzeilt dat
      volledig, terwijl een native client het secret zou moeten meeslepen (onveilig)
      of op interactieve login zou stuklopen. Bovendien is de MIT-engine
      (MarkMpn.Sql4Cds.Engine, met NetCore-tests) cross-platform bewezen en dus direct
      bruikbaar in een web-backend, terwijl native een dure port zou vragen. De
      gebruiker koos deze richting op 2026-10-30; het volledige overdrachtsdocument
      voor de bouwsessie staat in START.md."
    files:
      - START.md
      - afspraken/decisions.yaml
      - CONTEXT.md
    status: active
  - id: 2026-10-30-stack-aspnetcore-react
    date: 2026-10-30
    title: "Stack: ASP.NET Core (C#, engine inprocess) + React/TypeScript/Vite, PWA-klaar"
    decision: "De backend is ASP.NET Core op .NET 10 in C# en gebruikt
      MarkMpn.Sql4Cds.Engine als NuGet-library inprocess (geen subprocess, geen
      Node-vertaalslag). De frontend is React + TypeScript, gebouwd met Vite, en
      PWA-klaar (manifest + service worker) zodat de app op de iPhone te installeren
      is. Repostructuur: backend/XrmPocket.Api (API + engine), web/ (frontend),
      docs/ (spikes en architectuur). Handhaving: de backend-taal blijft C# zolang de
      engine in C# is; het client secret blijft server-side in
      ~/.config/opencode/secrets/ en komt nooit in web/, nooit in een build-artefact
      en nooit in de repo; de frontend praat uitsluitend met de eigen API en nooit
      rechtstreeks met Dataverse. Deze beslissing vervangt
      2026-10-30-project-aangemaakt-met-conventies. Op 2026-10-30 is de keuzevraag
      aan de gebruiker voorgelegd en overgeslagen; de aanbevolen optie is aangehouden
      en blijft aanpasbaar zolang er geen UI-afhankelijkheden zijn."
    rationale: "De engine (MIT) is C# en levert SQL naar FetchXML plus uitvoering;
      dezelfde taal houdt dat inprocess en vermijdt een IPC-laag met eigen
      foutpaden. Een bewezen spike op 2026-10-30 (docs/spike-2026-10-30-sql-naar-fetchxml.md)
      toont SQL naar FetchXML en uitvoering via een zelfgemaakte mock-connector zonder
      XrmToolBox en zonder Dataverse-verbinding. React geeft ruimte voor de latere
      XrmToolBox-achtige uitbreidingen (meerdere tools, panels, grids) zonder de
      UI-state met de hand te beheren."
    files:
      - backend/XrmPocket.Api/XrmPocket.Api.csproj
      - web/package.json
      - docs/spike-2026-10-30-sql-naar-fetchxml.md
      - CONTEXT.md
    status: active
  - id: 2026-10-31-app-poort-4108
    date: 2026-10-31
    title: "XrmPocket-app draait op poort 4108; Sauron-poorten blijven ongemoeid"
    decision: "De XrmPocket-API en de gebouwde PWA draaien op poort 4108 (0.0.0.0 in
      appsettings.json); de Vite-devserver gebruikt 5173 met een proxy naar 4108.
      Poort 4107 blijft van de Sauron/openCode-sessie van dit project en wordt niet
      door de app gebruikt. Handhaving: geen bestaande poort (4101-4107) hergebruiken
      of wijzigen; een nieuwe poort wordt eerst in de Sauron-brug vrij gehouden en pas
      daarna in de app gezet."
    rationale: "Bij de eerste start bleek poort 4107 al bezet door de door Sauron
      gestarte openCode-sessie van dit project (127.0.0.1), waardoor verzoeken aan
      localhost bij die sessie uitkwamen in plaats van bij de app. De app heeft een
      eigen poort nodig; 4108 is de volgende vrije."
    files:
      - backend/XrmPocket.Api/appsettings.json
      - web/vite.config.ts
      - docs/architectuur.md
    status: active
  - id: 2026-10-31-verbindingen-zoals-xrmtoolbox
    date: 2026-10-31
    title: "Verbindingen zoals XrmToolBox (lijst + standaard + test), maar secrets buiten het profiel"
    decision: "Verbindingen volgen het model van XrmToolBox: een lijst met opgeslagen
      verbindingen (ConnectionProfile met id, naam, soort, authType, omgeving, URL,
      client-ID, tenant, time-out, kleurmarkering en laatst gebruikt), één
      standaardverbinding, een test per verbinding (WhoAmI) en een eigen secret per
      verbinding. De lijst staat in ~/.config/xrmpocket/connections.json (chmod 600,
      buiten de repo). Het client secret staat NIET in dat bestand: het profiel bevat
      enkel het pad naar een bestand met chmod 600; een nieuw secret gaat via
      POST /api/connections/{id}/secret en wordt nooit teruggegeven of gelogd.
      Alleen app-only (client credentials) is toegestaan; interactieve login blijft
      uitgeschakeld. Handhaving: nooit een secret, wachtwoord of token in
      connections.json, in een API-antwoord of in een log; geen GPL-code van
      XrmToolBox of MscrmTools.Xrm.Connection overnemen (enkel gedrag bestuderen en
      zelf implementeren); geen interactieve authenticatie aanzetten zonder nieuwe
      beslissing die de CA-bevinding (AADSTS530033) weerlegt."
    rationale: "De gebruiker vroeg om verbindingen op dezelfde manier als XrmToolBox
      te doen. Brononderzoek (XrmToolBox + MscrmTools.Xrm.Connection, beide GPL-3.0)
      toont: ConnectionDetail met URL's/tenant/authType/highlight/time-out/LastUsedOn,
      een connection-lijst in XML, een Connection Manager, een initial connection bij
      het starten, hergebruik van clients en een RequestPassword-stroom voor
      ontbrekende secrets. Dat model nemen we over omdat het herkenbaar is en
      veelomgevingenwerk ondersteunt. Op één punt wijken we bewust af: XrmToolBox
      versleutelt secrets met een sleutel die in de applicatie zit (terug te vinden),
      wij bewaren ze in een apart bestand met chmod 600 en houden enkel het pad in het
      profiel — dat is beter te bewaken en houdt de repo schoon. Interactieve login
      blijft uit omdat Conditional Access dat op onbeheerde apparaten blokkeert."
    files:
      - backend/XrmPocket.Api/Connections/ConnectionProfile.cs
      - backend/XrmPocket.Api/Connections/ConnectionStore.cs
      - backend/XrmPocket.Api/Connections/ConnectionFactory.cs
      - web/src/ConnectionManager.tsx
      - docs/verbindingen.md
      - CONTEXT.md
    status: active
